spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

app:
  workspace:
    invitation-ttl: 7d
  security:
    jwt:
      secret: test-secret-must-be-at-least-thirty-two-bytes
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      # Matches the shipped default: tests that need a replay to count as reuse
      # backdate the revocation rather than waiting this out.
      refresh-reuse-grace: 10s
    refresh-cookie:
      secure: false
    rate-limit:
      enabled: false
      max-entries: 1000
      idle-ttl: 1h
  ai:
    enabled: false
    suggestion-ttl: 7d
    request-timeout: 30s
    max-breakdown-items: 8
    include-comments-limit: 20
    include-activity-limit: 20
    max-context-issues: 100
    rate-limit:
      enabled: false
      capacity: 10
      window: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
