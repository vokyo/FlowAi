spring:
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    retry:
      max-attempts: 3
    # AI apps reach the workspace through this MCP endpoint with a personal access
    # token. Stateless, so no MCP session lives in one instance's memory and any
    # instance can answer; under /api, so Nginx already forwards it.
    mcp:
      server:
        name: flowai
        version: 1.0.0
        type: sync
        protocol: stateless
        instructions: >-
          Read-only access to one FlowAI workspace, the one the personal access token
          was created in. Call list_projects first, then search a project's issues or
          list its members by projectId.
        annotation-scanner:
          enabled: false
        capabilities:
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /api/mcp
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowai}
    username: ${SPRING_DATASOURCE_USERNAME:flowai}
    password: ${SPRING_DATASOURCE_PASSWORD:flowai_dev_password}

  # Redis holds only short-lived state that backend instances share, and nothing may
  # stop working because it is down. A slow Redis therefore has to fail fast: Lettuce
  # would otherwise wait 60 seconds for every command.
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: ${REDIS_TIMEOUT:300ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      # Values go through templates; nothing is stored as a Redis repository.
      repositories:
        enabled: false
app:
  # Off, every instance counts rate limits in its own memory and planning runs are not
  # locked, which is all a single instance needs. On, the instances share the limits
  # and a lock per person and project through the Redis above; one that cannot reach
  # Redis in time counts on its own and runs unlocked until it can.
  redis:
    enabled: ${REDIS_ENABLED:false}
  workspace:
    invitation-ttl: 7d
  # Each personal access token's requests to the MCP endpoint, shared through Redis
  # like every other limit.
  mcp:
    rate-limit:
      capacity: ${MCP_RATE_LIMIT_CAPACITY:60}
      window: ${MCP_RATE_LIMIT_WINDOW:1m}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-entries: ${RATE_LIMIT_MAX_ENTRIES:10000}
      idle-ttl: ${RATE_LIMIT_IDLE_TTL:1h}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}
    jwt:
      secret: ${JWT_SECRET:dev-secret-must-be-long-enough-for-hmac-sha256}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      # A superseded refresh token replayed this soon after rotation is concurrency,
      # not theft: restoring several tabs sends the same cookie from each of them.
      # Past this window a replay revokes every session for the membership.
      refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:10s}
  ai:
    enabled: ${AI_ENABLED:false}
    suggestion-ttl: ${AI_SUGGESTION_TTL:7d}
    request-timeout: ${AI_REQUEST_TIMEOUT:30s}
    max-breakdown-items: ${AI_MAX_BREAKDOWN_ITEMS:8}
    include-comments-limit: 20
    include-activity-limit: 20
    max-context-issues: 100
    rate-limit:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      capacity: ${AI_RATE_LIMIT_CAPACITY:10}
      window: ${AI_RATE_LIMIT_WINDOW:1m}
  # The planning agent is a separate Python service reached only from the backend.
  # A run is a synchronous call, so the read timeout caps how long a request waits.
  # Off unless a deployment runs the agent: the status endpoint then tells the UI,
  # and starting or revising a run is refused without trying to reach it.
  agent:
    enabled: ${AGENT_ENABLED:false}
    base-url: ${AGENT_BASE_URL:http://localhost:8000}
    connect-timeout: ${AGENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${AGENT_READ_TIMEOUT:60s}
  # Seeds a worked-in demo workspace on startup. Off unless the deployment asks
  # for it, so developer machines and real deployments are untouched. Moving the
  # demo to another platform is a matter of setting DEMO_SEED_ENABLED there.
  demo:
    enabled: ${DEMO_SEED_ENABLED:false}
    email: ${DEMO_SEED_EMAIL:demo@flowai.dev}
    password: ${DEMO_SEED_PASSWORD:demo1234}
    workspace-name: ${DEMO_SEED_WORKSPACE_NAME:Northwind Labs}


management:
  health:
    # Nothing in the backend needs Redis to work, so a Redis outage must not mark a
    # working instance unhealthy and get it restarted.
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  pattern:
    correlation: "[%X{traceId:-}] "
