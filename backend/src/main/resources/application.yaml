spring:
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
    retry:
      max-attempts: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowai}
    username: ${SPRING_DATASOURCE_USERNAME:flowai}
    password: ${SPRING_DATASOURCE_PASSWORD:flowai_dev_password}
app:
  workspace:
    invitation-ttl: 7d
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-entries: ${RATE_LIMIT_MAX_ENTRIES:10000}
      idle-ttl: ${RATE_LIMIT_IDLE_TTL:1h}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}
    jwt:
      secret: ${JWT_SECRET:dev-secret-must-be-long-enough-for-hmac-sha256}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      # A superseded refresh token replayed this soon after rotation is concurrency,
      # not theft: restoring several tabs sends the same cookie from each of them.
      # Past this window a replay revokes every session for the membership.
      refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:10s}
  ai:
    enabled: ${AI_ENABLED:false}
    suggestion-ttl: ${AI_SUGGESTION_TTL:7d}
    request-timeout: ${AI_REQUEST_TIMEOUT:30s}
    max-breakdown-items: ${AI_MAX_BREAKDOWN_ITEMS:8}
    include-comments-limit: 20
    include-activity-limit: 20
    max-context-issues: 100
    rate-limit:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      capacity: ${AI_RATE_LIMIT_CAPACITY:10}
      window: ${AI_RATE_LIMIT_WINDOW:1m}
  # Seeds a worked-in demo workspace on startup. Off unless the deployment asks
  # for it, so developer machines and real deployments are untouched. Moving the
  # demo to another platform is a matter of setting DEMO_SEED_ENABLED there.
  demo:
    enabled: ${DEMO_SEED_ENABLED:false}
    email: ${DEMO_SEED_EMAIL:demo@flowai.dev}
    password: ${DEMO_SEED_PASSWORD:demo1234}
    workspace-name: ${DEMO_SEED_WORKSPACE_NAME:Northwind Labs}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  pattern:
    correlation: "[%X{traceId:-}] "
